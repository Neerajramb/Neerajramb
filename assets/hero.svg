<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Hey there, I'm Neeraj Ram B. Computer Science Student, Aspiring Software Developer, AI and ML builder, Tech Explorer, Problem Solver.">
<style>
  .hi { font: 500 28px 'Inter','Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; fill: #8B949E; }
  .name { font: 800 98px 'Inter','Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; letter-spacing: -1.5px; }
  .role { font: 500 28px 'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace; fill: #E6EDF3; }
  .prompt { font: 700 28px 'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace; fill: #22D3EE; }
  .pill { font: 500 17px 'Inter','Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; fill: #E6EDF3; }
  .caret { fill: #A78BFA; animation: blink 1s steps(1) infinite; }
  .edge { stroke: #ffffff; stroke-opacity: .10; stroke-width: 1.2; }
  .pulse { fill: #22D3EE; filter: drop-shadow(0 0 4px #22D3EE); }
  .node { fill: #1E1B4B; stroke: #A78BFA; stroke-width: 1.6; transform-box: fill-box; transform-origin: center; animation: breathe 2.4s ease-in-out infinite; }
  .orb { transform-box: fill-box; transform-origin: center; }
  .o1 { animation: drift1 16s ease-in-out infinite alternate; }
  .o2 { animation: drift2 19s ease-in-out infinite alternate; }
  .o3 { animation: drift3 23s ease-in-out infinite alternate; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; } .d4 { animation-delay: .6s; }
  .wave { transform-box: fill-box; transform-origin: 70% 80%; animation: wave 2.6s ease-in-out infinite; }
  .dot { fill: #4ADE80; transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes breathe { 50% { transform: scale(1.25); stroke-opacity: .55; } }
  @keyframes drift1 { to { transform: translate(140px, 40px) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-160px, -30px) scale(.9); } }
  @keyframes drift3 { to { transform: translate(90px, -60px) scale(1.2); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(16deg); } 20%,40% { transform: rotate(-8deg); } }
  @keyframes ping { 0% { transform: scale(1); opacity: .9; } 80%,100% { transform: scale(2.6); opacity: 0; } }
  
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
</style>
