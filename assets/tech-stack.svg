<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 536" width="1200" height="536" role="img" aria-label="Tech stack. Languages: C, Java, Python, JavaScript, SQL, HTML5, CSS3, PowerShell. Web &amp; APIs: React, Node.js, Django, REST APIs. AI / ML: OpenCV, Whisper, FAISS, ChromaDB, Gemini API, Sentence Transformers. Data Science: Pandas, NumPy, Matplotlib. Databases: SQLite, PostgreSQL, MySQL. Design &amp; Audio: Photoshop, Lightroom, Figma, Framer, Canva, Audacity, Ableton Live. Tools: Git, GitHub.">
<style>
  .cat { font: 700 15px 'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace; fill: #8B949E; letter-spacing: 1.5px; }
  .chip { font: 500 18px 'Inter','Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; fill: #E6EDF3; }
  .rise { animation: rise .6s ease-out both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.2,1.4,.4,1) both; }
  .halo { transform-box: fill-box; transform-origin: center; animation: halo 3s ease-out infinite; }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease forwards; }
  @keyframes rise { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes halo { 0% { transform: scale(1); opacity: .7; } 70%,100% { transform: scale(2.4); opacity: 0; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .draw { stroke-dashoffset: 0; } .halo { opacity: 0; } }
</style>
