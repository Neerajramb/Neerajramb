name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch: # lets you run it from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161B22,#2E1065,#5B21B6,#8B5CF6,#C4B5FD

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
